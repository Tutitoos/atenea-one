[package]
name = "atenea-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Fuera del workspace raíz (excluido allí): lockfile y perfil propios.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
atenea-protocol = { path = "../crates/protocol" }
atenea-crypto = { path = "../crates/crypto" }
atenea-identity = { path = "../crates/identity" }
atenea-policies = { path = "../crates/policies" }
atenea-nat-traversal = { path = "../crates/nat-traversal" }
atenea-relay-core = { path = "../crates/relay-core" }
# Solo para firmar con claves fijas de fuzz (signed_config_verify) y compilar el motor del agente.
ed25519-dalek = "3.0.0"
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "datagram_parse"
path = "fuzz_targets/datagram_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "replay_window"
path = "fuzz_targets/replay_window.rs"
test = false
doc = false
bench = false

