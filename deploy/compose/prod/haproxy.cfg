global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 90s
  timeout server 90s

frontend tls
  bind :443
  tcp-request inspect-delay 5s
  tcp-request content reject if !{ req.ssl_hello_type 1 } WAIT_END
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend relay if { req.ssl_sni -i "${RELAY_HOST}" } { req.ssl_alpn -m str atenea-relay/2 }
  default_backend panel

backend relay
  server relay 127.0.0.1:8443 send-proxy-v2

backend panel
  server caddy caddy-proxy:443 check send-proxy-v2 check-send-proxy
