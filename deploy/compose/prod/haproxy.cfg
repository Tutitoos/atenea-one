global
  log stdout format raw local0
  maxconn 2048

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 90s
  timeout server 90s

frontend tls
  bind :443
  # Tope de conexiones simultáneas por origen (IPv4 exacta, IPv6 por /64): una sola dirección no ocupa
  # las 2048 de la entrada, que comparten panel, API, coordinator y relay TLS. Subirlo si muchos
  # dispositivos salen por la misma IP pública (cada agente mantiene una conexión de avisos por red).
  stick-table type ipv6 size 100k expire 5m store conn_cur
  tcp-request connection track-sc0 src,ipmask(32,64)
  tcp-request connection reject if { sc0_conn_cur gt 128 }
  tcp-request inspect-delay 5s
  tcp-request content reject if !{ req.ssl_hello_type 1 } WAIT_END
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend relay if { req.ssl_sni -i "${RELAY_HOST}" } { req.ssl_alpn -m str atenea-relay/2 }
  default_backend panel

backend relay
  server relay 127.0.0.1:8443 send-proxy-v2

backend panel
  server caddy caddy-proxy:443 check send-proxy-v2 check-send-proxy
