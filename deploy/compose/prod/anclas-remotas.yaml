# ADR-018: unirse con solo el código, mitad 2 (ANCLAS REMOTAS). Overlay OPCIONAL e independiente de
# union-codigo.yaml. ACTIVARLO CAMBIA EN QUIÉN CONFÍA EL COORDINATOR: pasa a aceptar las redes que cree el control
# plane (ADR-018 § 4); hacerlo solo con la creación de redes restringida a personas de confianza.
#  - El control plane abre un listener INTERNO (8082, sin `ports:`, solo red `backend`) con las raíces de las redes;
#    el coordinator las lee con un secreto Bearer. Caddy no lo proxifica: solo conoce control-plane:8080.
# Requisitos: secreto `anchors-token` en ${ATENEA_RUNTIME_DIR}/secrets (>= 16 caracteres imprimibles, 0400, UID de
# los servicios). En el `coordinator.toml` de la fuente de configuración hay que añadir además
# (ver apps/coordinator/README.md):
#   [anchors_source]
#   url = "http://control-plane:8082/internal/v1/root-anchors"
#   secret_file = "/run/secrets/anchors-token"
services:
  control-plane:
    environment:
      ATENEA_CP_INTERNAL_LISTEN: 0.0.0.0:8082
      ATENEA_CP_INTERNAL_SECRET_FILE: /run/secrets/anchors-token
    secrets: [anchors-token]
  coordinator:
    secrets: [anchors-token]
secrets:
  anchors-token: {file: '${ATENEA_RUNTIME_DIR:?}/secrets/anchors-token'}
