services:
  postgres:
    image: ${ATENEA_BACKUP_IMAGE:?digest de imagen backup requerido}
    secrets:
      - pgbackrest_cipher
    volumes:
      - pgbackrest-repo:/var/lib/pgbackrest
      - pg-socket:/var/run/postgresql
    tmpfs: !override
      - /run/pgbackrest:uid=999,gid=999,mode=0700
      - /tmp:rw,noexec,nosuid,size=64m
  backup:
    image: ${ATENEA_BACKUP_IMAGE:?digest de imagen backup requerido}
    user: postgres
    read_only: true
    restart: unless-stopped
    command: [backup-schedule]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - pgbackrest_cipher
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - pgbackrest-repo:/var/lib/pgbackrest
      - pg-socket:/var/run/postgresql
    tmpfs:
      - /run/pgbackrest:uid=999,gid=999,mode=0700
      - /tmp
    healthcheck:
      # Estado correcto del stanza y una copia (completa o incremental horaria) de menos de 3 h.
      test:
        - CMD
        - backup-entrypoint
        - python3
        - -c
        - >-
          import json, subprocess, sys, time;
          i = json.loads(subprocess.check_output(['pgbackrest', '--stanza=atenea', 'info', '--output=json']));
          s = i[0];
          sys.exit(0 if s['status']['code'] == 0 and s['backup'] and time.time() - s['backup'][-1]['timestamp']['stop'] < 10800 else 1)
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    networks: [backend]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  pgbackrest-repo:
  pg-socket:
secrets:
  pgbackrest_cipher:
    file: ${ATENEA_SECRETS_DIR:?Defina directorio de secretos}/pgbackrest-cipher
