# ADR-018: unirse con solo el código, mitad 1 (CONECTIVIDAD). Overlay OPCIONAL (como backup.yaml): sin él el stack
# se comporta como la 0.1.8. Es independiente de anclas-remotas.yaml y no cambia en quién confía el coordinator.
#  - El control plane anuncia en el código de unión el host STUN y el SHA-256 de la CA del relay, y sirve esa CA
#    (pública) en GET /api/v1/relay-ca.
# Requisitos: `ATENEA_STUN_HOST` (nombre o IPv4 del STUN, sin puerto) y la CA del relay en certs/ca.pem.
services:
  control-plane:
    environment:
      ATENEA_CP_STUN_HOST: ${ATENEA_STUN_HOST:?nombre o IPv4 del STUN, sin puerto}
      ATENEA_CP_RELAY_CA_FILE: /etc/atenea/relay-ca.pem
    volumes:
      - '${ATENEA_RUNTIME_DIR:?}/certs/ca.pem:/etc/atenea/relay-ca.pem:ro'
