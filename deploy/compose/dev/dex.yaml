# Proveedor OIDC SOLO para desarrollo y laboratorio (no usar en producción).
# Usuarios y secretos son sintéticos y públicos.
issuer: http://dex:5556/dex
storage:
  type: memory
web:
  http: 0.0.0.0:5556
oauth2:
  skipApprovalScreen: true
enablePasswordDB: true
staticClients:
  - id: atenea-control-plane
    name: Atenea One (desarrollo)
    secret: dev-only-secret-not-for-production
    redirectURIs:
      - http://192.0.2.254:8080/auth/callback
      - http://localhost:8080/auth/callback
staticPasswords:
