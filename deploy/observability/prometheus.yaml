global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yaml
scrape_configs:
  - job_name: control-plane
    static_configs:
      - targets: ['control-plane:9100']
  - job_name: coordinator
    static_configs:
      - targets: ['coordinator:9100']
  - job_name: relay
    static_configs:
      - targets: ['netns:9100']
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
