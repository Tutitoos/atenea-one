---
- name: Actualizar con rollback del manifiesto anterior
  hosts: principal:relays
  become: true
  serial: 1
  vars:
    atenea_stack_dir: /opt/atenea
    atenea_stack_health_timeout: 180
  tasks:
    - name: Exigir backup verificado antes de actualizar
      ansible.builtin.assert:
        that:
          - atenea_backup_verified | default(false) | bool
    - name: Guardar manifiesto y entorno realmente desplegados
      ansible.builtin.slurp:
        src: "{{ atenea_stack_dir }}/{{ item }}"
      loop: [.env, compose.override.yaml]
      register: atenea_previous_manifest
      no_log: true
    - name: Desplegar y comprobar salud
      block:
        - name: Aplicar nueva distribución y migraciones
          ansible.builtin.include_role:
            name: atenea_stack
      rescue:
        - name: Recuperar referencias por digest y entorno anteriores
          ansible.builtin.copy:
            content: "{{ item.content | b64decode }}"
            dest: "{{ atenea_stack_dir }}/{{ item.item }}"
            mode: '0600'
          loop: "{{ atenea_previous_manifest.results }}"
          no_log: true
        - name: Arrancar digests anteriores sin deshacer migraciones
          ansible.builtin.command:
            argv: [docker, compose, --project-directory, "{{ atenea_stack_dir }}", up, -d, --wait, --wait-timeout, "{{ atenea_stack_health_timeout | string }}"]
          changed_when: true
        - name: Comprobar salud recuperada de todos los servicios
          ansible.builtin.include_tasks: roles/atenea_stack/tasks/health.yml
        - name: Informar fallo aunque rollback haya terminado
          ansible.builtin.fail:
            msg: Actualización fallida; rollback al mapa de digests anterior saludable. Revisar el fallo y las migraciones expand/contract.
