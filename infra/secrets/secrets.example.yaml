---
# Esquema sintético: sustituir todos los valores y cifrar antes de desplegar.
# En el secundario solo relay.key; el certificado público va en certs/relay.pem.
files:
  postgres-password: REEMPLAZAR
  app-database-url: postgres://atenea_app:REEMPLAZAR@postgres/atenea
  migration-database-url: postgres://postgres:REEMPLAZAR@postgres/atenea
  oidc-client-secret: REEMPLAZAR
  issuer.key: GENERAR_32_BYTES_HEX
  relay-signing.hex: GENERAR_OTROS_32_BYTES_HEX
  relay.key: CLAVE_TLS_PEM
  postgres-init.sql: SQL_DE_CREACION_DEL_ROL_LIMITADO_CON_PASSWORD
  dex.yaml: CONFIGURACION_DEX_CON_CLIENT_SECRET
