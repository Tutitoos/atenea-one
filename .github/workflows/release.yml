name: Release verificable

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Cada job declara lo mínimo que necesita.
permissions: {}

jobs:
  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identidad y toolchain
        run: |
          echo "ATENEA_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ATENEA_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("apps/cli/Cargo.toml","rb"))["package"]["version"])')" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Construir binarios, Debian e inventarios
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "${GITHUB_REF#refs/tags/v}" = "$ATENEA_VERSION"; fi
          cargo fetch --locked
          cargo build --offline --locked --release -p atenea-cli -p atenea-agent -p atenea-control-plane -p atenea-coordinator -p atenea-relay
          mkdir dist
          for name in atenea atenea-agent atenea-control-plane atenea-coordinator atenea-relay; do
            test "$(target/release/$name --version)" = "$name $ATENEA_VERSION ($ATENEA_BUILD_COMMIT)"
            cp "target/release/$name" "dist/$name-linux"
          done
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo metadata --offline --locked --format-version 1 --filter-platform "$host" > dist/cargo-metadata.json
          python3 scripts/release/build-info.py > dist/BUILD-INFO.json
          python3 -c 'import json, subprocess; p="dist/BUILD-INFO.json"; d=json.load(open(p)); d["toolchain"]=subprocess.check_output(["rustc","--version"],text=True).strip(); open(p,"w").write(json.dumps(d,sort_keys=True)+"\n")'
          arch=$(dpkg --print-architecture)
          packaging/deb/build.sh target/release "$ATENEA_VERSION" "$arch" "dist/atenea-cli-$ATENEA_VERSION-linux-$arch.deb"
          # Alias: quien descargaba `atenea.deb` sigue recibiendo el mismo paquete (entra en manifiesto y atestación).
          cp "dist/atenea-cli-$ATENEA_VERSION-linux-$arch.deb" dist/atenea.deb
          python3 scripts/release/sbom.py rust dist/cargo-metadata.json dist/rust.cdx.json --version "$ATENEA_VERSION" --commit "$ATENEA_BUILD_COMMIT" \
            --target "$host" --deb-depends packaging/deb/build.sh \
            --root atenea-cli --root atenea-agent --root atenea-control-plane --root atenea-coordinator --root atenea-relay
          python3 scripts/release/sbom.py panel pnpm-lock.yaml dist/panel.cdx.json --version "$ATENEA_VERSION" --commit "$ATENEA_BUILD_COMMIT"
      - name: Activar exportación OCI en el runner desechable
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config.setdefault('features', {})['containerd-snapshotter'] = True
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
      - name: Construir imágenes sin publicar
        run: |
          set -euo pipefail
          for service in control-plane coordinator relay; do
            docker build --provenance=false --sbom=false --build-arg "ATENEA_BUILD_COMMIT=$GITHUB_SHA" -t "atenea-release/$service:build" -f "deploy/images/$service/Dockerfile" .
            test "$(docker run --rm --network none "atenea-release/$service:build" --version)" = "atenea-$service $ATENEA_VERSION ($GITHUB_SHA)"
          done
          # El entrypoint de postgres-backup exige un secreto montado: se comprueba pgBackRest con otro entrypoint.
          docker build --provenance=false --sbom=false --build-arg "ATENEA_BUILD_COMMIT=$GITHUB_SHA" -t atenea-release/postgres-backup:build -f deploy/backup/Dockerfile .
          version_line=$(docker run --rm --network none --entrypoint pgbackrest atenea-release/postgres-backup:build version)
          [[ "$version_line" =~ ^pgBackRest\ [0-9]+\.[0-9]+ ]]
          python3 scripts/release/images.py dist "$GITHUB_SHA" "$ATENEA_VERSION" control-plane=atenea-release/control-plane:build coordinator=atenea-release/coordinator:build relay=atenea-release/relay:build postgres-backup=atenea-release/postgres-backup:build
      - name: Atestar procedencia de los artefactos
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  native:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar identidad y toolchain
        run: |
          echo "ATENEA_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ATENEA_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("apps/cli/Cargo.toml","rb"))["package"]["version"])')" >> "$GITHUB_ENV"
          toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml","rb"))["toolchain"]["channel"])')
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          rustup toolchain install "$toolchain" --profile minimal
      - name: Construir cliente nativo
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          set -euo pipefail
          cargo fetch --locked
          cargo build --offline --locked --release -p atenea-cli -p atenea-agent
          mkdir dist
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          case "$(uname -m)" in arm64 | aarch64) arch=arm64 ;; x86_64 | AMD64) arch=amd64 ;; *) echo 'Arquitectura no admitida' >&2; exit 2 ;; esac
          for name in atenea atenea-agent; do
            test "$(target/release/$name$suffix --version | tr -d '\r')" = "$name $ATENEA_VERSION ($GITHUB_SHA)"
            # Windows publica el binario tal cual, con el nombre estándar; los de macOS solo viajan dentro del .pkg.
            dest="$name-$RUNNER_OS"
            if [ "$RUNNER_OS" = Windows ]; then component=${name#atenea}; component=${component#-}; dest="atenea-${component:-cli}-$ATENEA_VERSION-windows-$arch"; fi
            cp "target/release/$name$suffix" "dist/$dest$suffix"
          done
          host=$(rustc -vV | sed -n 's/^host: //p')
          cargo metadata --offline --locked --format-version 1 --filter-platform "$host" > "$RUNNER_TEMP/native-metadata.json"
          extra=()
          if [ "$RUNNER_OS" = Windows ]; then extra=(--wintun packaging/windows/get-wintun.ps1); fi
          python3 scripts/release/sbom.py rust "$RUNNER_TEMP/native-metadata.json" "dist/rust-$RUNNER_OS.cdx.json" --version "$ATENEA_VERSION" --commit "$GITHUB_SHA" \
            --target "$host" --root atenea-cli --root atenea-agent ${extra[@]+"${extra[@]}"}
          python3 scripts/release/build-info.py > "dist/$RUNNER_OS.build-info.json"
      - name: Construir PKG sin firmar
        if: runner.os == 'macOS'
        run: |
          packaging/macos/build-pkg.sh
          pkgutil --payload-files target/macos-package/atenea-cli-*.pkg
          cp target/macos-package/*.pkg dist/
      - name: Construir ZIP sin firmar
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          packaging/windows/build-zip.ps1
          Copy-Item target/windows-package/*.zip dist/
      - name: Atestar procedencia de los artefactos
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  # La interfaz se compila una vez (Linux) y los tres sistemas la embeben, como en ci.yml.
  desktop-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Instalar pnpm fijado
        run: scripts/install-pnpm.sh
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @atenea/desktop run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-ui
          path: apps/desktop/build/client
          if-no-files-found: error

  # Aplicación de escritorio (Go + Wails v3): un paquete por sistema operativo, sin firma de desarrollador (ADR-019).
  desktop:
    needs: desktop-ui
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: desktop-ui
          path: apps/desktop/build/client
      - name: Identidad
        run: |
          echo "ATENEA_BUILD_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "ATENEA_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("apps/cli/Cargo.toml","rb"))["package"]["version"])')" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Dependencias de WebKitGTK, xvfb y dbus (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: '"$GITHUB_WORKSPACE/scripts/install-linux-desktop-deps.sh"' # sin caché: el paquete de release no depende de una caché de la CI
      - name: "Instalar wails3 a la versión de go.mod (solo Linux, para .deb y .rpm)"
        if: runner.os == 'Linux'
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$(awk '/wailsapp\/wails\/v3 v/ {print $NF; exit}' apps/desktop/go.mod)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Instalar NSIS a versión fija (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install nsis --version=3.11 --yes --no-progress
      - name: Compilar y probar el binario de producción
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then test "${GITHUB_REF#refs/tags/v}" = "$ATENEA_VERSION"; fi
          binary="$RUNNER_TEMP/atenea-desktop"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          packaging/desktop/build-binary.sh "$binary"
          echo "ATENEA_DESKTOP_BINARY=$binary" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Linux ]; then
            # El sandbox de WebKitGTK no arranca en el runner (ver ci.yml); se desactiva solo en esta prueba.
            WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 GDK_BACKEND=x11 WEBKIT_DISABLE_DMABUF_RENDERER=1 LIBGL_ALWAYS_SOFTWARE=1 \
              python3 apps/desktop/scripts/smoke.py 120 xvfb-run -a dbus-run-session -- "$binary"
          else
            python3 apps/desktop/scripts/smoke.py 120 "$binary"
          fi
      - name: Empaquetar sin firmar, inventario e identidad
        run: |
          set -euo pipefail
          packaging/desktop/build.sh dist
          packaging/desktop/check-package.sh dist
      - name: Atestar procedencia de los artefactos
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  # Instalador único de macOS (ADR-022): reempaqueta, sin recompilar, el `.pkg` del cliente y la aplicación ya probados
  # por los jobs `native` y `desktop`. Sin firma de desarrollador ni notarización.
  suite-macos:
    needs: [native, desktop]
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: parts
          pattern: "{macOS,desktop-macOS}"
          merge-multiple: true
      - name: Construir y comprobar el instalador único
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("apps/cli/Cargo.toml","rb"))["package"]["version"])')
          if [ "$GITHUB_REF" != "${GITHUB_REF#refs/tags/}" ]; then test "${GITHUB_REF#refs/tags/v}" = "$version"; fi
          mkdir -p dist
          packaging/macos/build-suite-pkg.sh parts/atenea-cli-"$version"-macos-*.pkg parts/atenea-desktop-"$version"-macos-*.dmg "$version" dist
          packaging/macos/check-suite-pkg.sh dist/atenea-one-"$version"-macos-*.pkg "$version"
      - name: Atestar procedencia del instalador
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: suite-macOS
          path: dist/*
          if-no-files-found: error

  assemble:
    needs: [linux, native, desktop, suite-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Solo los artefactos de release: `desktop-ui` (la interfaz compilada, intermedia) no debe mezclarse en dist/.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: "{linux,macOS,Windows,desktop-Linux,desktop-macOS,desktop-Windows,suite-macOS}"
          merge-multiple: true
      - name: Comprobar que dist/ solo contiene ficheros
        run: |
          set -euo pipefail
          if find dist -mindepth 1 -type d | grep -q .; then echo 'dist/ contiene directorios: se mezcló un artefacto intermedio' >&2; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: repo
      # Ensayo del manifiesto con una clave efímera sobre una COPIA de dist/: ata cada artefacto a su SBOM, comprueba
      # identidades y exige que no sobre ni falte ningún fichero. No firma nada real ni toca lo que se sube.
      - name: Ensayar manifiesto y verificación (clave efímera, sin publicar)
        run: |
          set -euo pipefail
          umask 077
          dry="$RUNNER_TEMP/dry"
          cp -R dist "$dry"
          openssl genpkey -algorithm ED25519 -out "$RUNNER_TEMP/dry.key"
          openssl pkey -in "$RUNNER_TEMP/dry.key" -pubout -out "$RUNNER_TEMP/dry.pub"
          commit=$(python3 -c 'import json; print(json.load(open("dist/BUILD-INFO.json"))["commit"])')
          version=$(python3 -c 'import json; print(json.load(open("dist/BUILD-INFO.json"))["version"])')
          export SOURCE_DATE_EPOCH=$(date +%s)
          python3 repo/scripts/release/manifest.py create "$dry" "$RUNNER_TEMP/dry.key" "$commit" "$version"
          bash repo/scripts/release/verify.sh "$dry" "$RUNNER_TEMP/dry.pub" "$commit" "$version"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-unsigned
          path: dist/*
          if-no-files-found: error

  # Única frontera con permisos de escritura, secreto y aprobación manual.
  # Solo se firma desde un tag v*; `workflow_dispatch` construye pero no publica.
  # El environment `release` (revisores, solo tags v*) se comprueba antes de usar el secreto.
  publish:
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-unsigned
          path: dist
      - name: Comprobar protección del environment release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GITHUB_REPOSITORY/environments/release/deployment-branch-policies" > "$RUNNER_TEMP/policies.json"
          python3 scripts/release/check-environment.py "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json"
      - name: Verificar que los artefactos se construyeron en este commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in dist/*; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --deny-self-hosted-runners > /dev/null
          done
      - name: Activar carga OCI en el runner desechable
        run: |
          sudo python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('/etc/docker/daemon.json')
          config = json.loads(path.read_text()) if path.exists() else {}
          config.setdefault('features', {})['containerd-snapshotter'] = True
          path.write_text(json.dumps(config))
          PY
          sudo systemctl restart docker
      - name: Exigir tag existente del mismo commit
        run: |
          set -euo pipefail
          version=$(python3 -c 'import json; print(json.load(open("dist/BUILD-INFO.json"))["version"])')
          git fetch --no-tags --depth=1 origin "refs/tags/v$version:refs/tags/v$version"
          test "$(git rev-parse "v$version^{commit}")" = "$GITHUB_SHA"
      - name: Publicar imágenes en GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          python3 scripts/release/publish-images.py dist "ghcr.io/${GITHUB_REPOSITORY,,}" "$RUNNER_TEMP/registry-digests.json"
      - name: Firmar manifiesto y publicar release
        env:
          ATENEA_RELEASE_KEY: ${{ secrets.ATENEA_RELEASE_ED25519_PEM }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          pub=$(mktemp)
          trap 'rm -f "$key" "$pub"; docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s\n' "$ATENEA_RELEASE_KEY" > "$key"
          openssl pkey -in "$key" -pubout -out "$pub"
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          version=$(python3 -c 'import json; print(json.load(open("dist/BUILD-INFO.json"))["version"])')
          python3 scripts/release/manifest.py create dist "$key" "$GITHUB_SHA" "$version" --registry-digests "$RUNNER_TEMP/registry-digests.json"
          bash scripts/release/verify.sh dist "$pub" "$GITHUB_SHA" "$version"
          # Se firma y verifica todo dist/, pero solo se publican los instaladores, SHA256SUMS (sin firmar), el manifiesto y su firma; lo publicado se verifica con `verify.sh --published`.
          gh release create "v$version" dist/*.pkg dist/*.dmg dist/*.deb dist/*.rpm dist/*.exe dist/SHA256SUMS dist/release-manifest.json dist/release-manifest.json.sig --target "$GITHUB_SHA" --verify-tag --title "Atenea $version" --notes 'Manifiesto Ed25519; verifique con la clave pública del responsable por canal independiente. PKG y paquetes de escritorio (DEB, RPM, DMG, EXE) sin firma de desarrollador ni notarización.'
