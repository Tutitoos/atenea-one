name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar pnpm
        run: npm install -g pnpm@11.23.0
      - name: Comprobaciones
        run: scripts/check.sh
      - name: Integración del control plane (PostgreSQL real)
        run: apps/control-plane/tests/run.sh
