version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # El runtime JS debe ir en la misma versión que github.com/wailsapp/wails/v3 (apps/desktop/go.mod). Por eso se ignoran
      # los dos (aquí y en la entrada gomod): subir solo uno los desalinea sin que la CI lo note. Se actualizan juntos, a
      # mano, con la prueba de humo de la aplicación.
      - dependency-name: "@wailsio/runtime"
  - package-ecosystem: gomod
    directory: /apps/desktop
    schedule:
      interval: weekly
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Va con @wailsio/runtime (ver la entrada npm).
      - dependency-name: "github.com/wailsapp/wails/v3"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Las imágenes se fijan por digest: Dependabot propone el digest nuevo.
  - package-ecosystem: docker
    directories: ["/deploy/**", "/tests/**", "/fuzz"]
    schedule:
      interval: weekly
