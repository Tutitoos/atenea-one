version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Las imágenes se fijan por digest: Dependabot propone el digest nuevo.
  - package-ecosystem: docker
    directories: ["/deploy/**", "/tests/**", "/fuzz"]
    schedule:
      interval: weekly
