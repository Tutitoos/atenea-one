[package]
name = "atenea-coordinator"
version = "0.1.1"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Coordinator de Atenea One: presencia, rendezvous y STUN propio"

[lints]
workspace = true

[dependencies]
atenea-observability.workspace = true
atenea-identity.workspace = true
atenea-nat-traversal.workspace = true
atenea-relay-core.workspace = true
axum = "0.8"
base64 = "0.22"
figment = { version = "0.10", features = ["env", "toml"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
