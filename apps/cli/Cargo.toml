[package]
name = "atenea-cli"
version = "0.1.21"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI de Atenea One: claves, emisión de configuraciones firmadas y administración del agente por IPC"

[lints]
workspace = true

[[bin]]
name = "atenea"
path = "src/main.rs"

[dependencies]
atenea-crypto.workspace = true
atenea-identity.workspace = true
clap.workspace = true
zeroize.workspace = true
serde.workspace = true
toml.workspace = true
# Edición que conserva comentarios y formato (`atenea services publish`); ya estaba en el árbol vía proc-macro-crate.
toml_edit = "0.25"
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.23"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
atenea-windows = { path = "../../crates/windows" }
