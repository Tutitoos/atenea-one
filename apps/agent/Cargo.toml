[package]
name = "atenea-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Agente VPN de Atenea One: propietario de la TUN y de las claves del dispositivo"

[lints]
workspace = true

[[bin]]
name = "atenea-agent"
path = "src/main.rs"

[dependencies]
atenea-protocol.workspace = true
atenea-crypto.workspace = true
atenea-identity.workspace = true
atenea-policies.workspace = true
atenea-nat-traversal.workspace = true
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "linux")'.dependencies]
atenea-tunnel.workspace = true
tokio.workspace = true
clap.workspace = true
