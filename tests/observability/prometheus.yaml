global:
  scrape_interval: 1s
  evaluation_interval: 1s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
  - job_name: control-plane
    static_configs: [{targets: ['lab:9101']}]
  - job_name: coordinator
    static_configs: [{targets: ['lab:9102']}]
  - job_name: relay
    static_configs: [{targets: ['lab:9103']}]
