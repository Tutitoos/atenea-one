[package]
name = "atenea-windows"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[target.'cfg(windows)'.dependencies]
tokio.workspace = true
tracing.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_SystemServices"] }
windows-service = "=0.8.0"
