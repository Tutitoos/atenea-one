[package]
name = "atenea-tunnel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Interfaz TUN L3 para Linux, macOS y Windows"

# Único crate con unsafe (ioctl/read/write sobre /dev/net/tun).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"
tokio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "=0.8.9"
tokio.workspace = true
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
