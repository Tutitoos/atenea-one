# cargo-deny: `cargo deny check advisories bans licenses sources` (CI, job supply-chain).
# Solo el grafo de producción: las dependencias exclusivas de pruebas no se distribuyen.
[graph]
exclude-dev = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
# Excepciones: añadir { id = "RUSTSEC-…", reason = "…", expiry = "P90D" } con motivo y caducidad.
ignore = []

[licenses]
# Compatibles con distribuir el conjunto bajo Apache-2.0. Wintun (binario) no es un crate: ver
# docs/architecture/dependencies.md.
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
