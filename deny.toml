# cargo-deny: `cargo deny check advisories bans licenses sources` (CI, job supply-chain).
# Solo el grafo de producción: las dependencias exclusivas de pruebas no se distribuyen.
[graph]
exclude-dev = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
# Excepciones temporales aprobadas; no hay claves privadas RSA/ECDSA en el flujo OIDC de producción.
ignore = [
    # REVISAR ANTES DE 2027-01-23
    { id = "RUSTSEC-2026-0387", reason = "apps/control-plane/src/auth.rs::callback solo verifica ID tokens: operaciones afectadas solo sobre enteros públicos (verificación); sin secretos ECDSA en el proceso. p256/p384 solo llegan por openidconnect 4.0.1; pendiente de openidconnect estable con p256/p384 0.14. Revisar antes de 2027-01-23. https://rustsec.org/advisories/RUSTSEC-2026-0387" },
    # REVISAR ANTES DE 2027-01-23
    { id = "RUSTSEC-2023-0071", reason = "apps/control-plane/src/auth.rs::callback verifica ID tokens con la clave pública RSA del IdP; no firma ni descifra con claves privadas RSA. apps/control-plane/tests/oidc.rs usa una clave efímera solo para el IdP de pruebas. Sin versión corregida upstream; revisar antes de 2027-01-23. https://rustsec.org/advisories/RUSTSEC-2023-0071" },
]

[licenses]
# Compatibles con distribuir el conjunto bajo Apache-2.0. Wintun (binario) no es un crate: ver
# docs/architecture/dependencies.md.
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
