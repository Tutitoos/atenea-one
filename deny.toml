# cargo-deny: `cargo deny check advisories bans licenses sources` (CI, job supply-chain).
# Solo el grafo de producción: las dependencias exclusivas de pruebas no se distribuyen.
[graph]
exclude-dev = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
# Excepción temporal aprobada; no hay claves privadas RSA en el flujo OIDC de producción.
# RUSTSEC-2026-0387 (crypto-bigint 0.5.5) se retiró el 2026-11-06: openidconnect 4.1.0 usa p256/p384 0.14 y el grafo de
# producción resuelve crypto-bigint 0.7.10. Solo queda 0.5.5 en dependencias de pruebas (jsonwebtoken), fuera de `exclude-dev`.
ignore = [
    # REVISAR ANTES DE 2027-01-23
    { id = "RUSTSEC-2023-0071", reason = "apps/control-plane/src/auth.rs::callback verifica ID tokens con la clave pública RSA del IdP; no firma ni descifra con claves privadas RSA. apps/control-plane/tests/oidc.rs usa una clave efímera solo para el IdP de pruebas. Sin versión corregida upstream; revisar antes de 2027-01-23. https://rustsec.org/advisories/RUSTSEC-2023-0071" },
]

[licenses]
# Compatibles con distribuir el conjunto bajo Apache-2.0. Wintun (binario) no es un crate: ver
# docs/architecture/dependencies.md.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # target-lexicon (compilación de las GTK de Tauri en Linux)
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
